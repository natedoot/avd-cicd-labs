prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 1.1.1.0/24 eq 32
  - sequence: 20
    action: permit 2.2.1.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 192.0.0.0/31
  - sequence: 20
    action: permit 192.0.10.0/31
- name: PL-GATEWAY-LOOP
  sequence_numbers:
  - sequence: 10
    action: permit 2.2.1.7/32
  - sequence: 20
    action: permit 1.1.1.7/32
  - sequence: 30
    action: permit 1.1.1.8/32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: deny
    description: Do not accept routes learned from MLAG peer that contain Route-Target extended communities
    match:
    - extcommunity CL-EVPN-IMPORTED
    set:
    - origin incomplete
  - sequence: 20
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
- name: RM-AS65000-IPV4-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-GATEWAY-LOOP
