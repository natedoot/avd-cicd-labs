route_maps:
- name: RM-AS65000-EVPN-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - community 65000:65000 additive
- name: RM-AS65000-EVPN-OUT
  sequence_numbers:
  - sequence: 5
    type: deny
    match:
    - community CL-REMOTE-DOMAIN-ORIGINATED
  - sequence: 10
    type: permit
- name: RM-AS65000-IPV4-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-GATEWAY-LOOP
- name: RM-AS65200-EVPN-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - community CL-REMOTE-DOMAIN-ORIGINATED
    set:
    - local-preference 0
  - sequence: 20
    type: permit
    set:
    - community 65200:65200 additive
- name: RM-AS65200-EVPN-OUT
  sequence_numbers:
  - sequence: 5
    type: deny
    match:
    - community CL-LOCAL-DOMAIN-ORIGINATED
  - sequence: 10
    type: permit
