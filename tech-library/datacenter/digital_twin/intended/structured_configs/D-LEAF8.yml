metadata:
  platform: vEOS-lab
  pod_name: pod-d
  dc_name: domain-d
  fabric_name: FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: domain-d
    - name: topology_hint_fabric
      value: FABRIC
    - name: topology_hint_pod
      value: pod-d
    - name: topology_hint_rack
      value: DOMAIN_D_EVPNGW
  digital_twin:
    environment: act
    node_type: veos
    ip_addr: 192.168.0.136/24
    version: 4.33.1.1F
    username: admin
    password: admin
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 1.1.4.0/24 eq 32
  - sequence: 20
    action: permit 2.2.4.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65478'
  router_id: 1.1.4.8
  distance:
    external_routes: 20
    internal_routes: 200
    local_routes: 200
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
    ecmp: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: LOCAL-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-CORE
    type: evpn
    local_as: '65500'
    remove_private_as:
      replace_as: true
    update_source: Loopback0
    bfd: false
    ebgp_multihop: 15
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.1.56
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE1
    description: D-SPINE1_Ethernet8
  - ip_address: 192.168.1.58
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE2
    description: D-SPINE2_Ethernet8
  - ip_address: 192.168.1.60
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE3
    description: D-SPINE3_Ethernet8
  - ip_address: 192.168.1.62
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE4
    description: D-SPINE4_Ethernet8
  - ip_address: 2001:db8:d:1::c9
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE1
    description: D-SPINE1_Loopback0
  - ip_address: 2001:db8:d:1::ca
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE2
    description: D-SPINE2_Loopback0
  - ip_address: 2001:db8:d:1::cb
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE3
    description: D-SPINE3_Loopback0
  - ip_address: 2001:db8:d:1::cc
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65400'
    peer: D-SPINE4
    description: D-SPINE4_Loopback0
  - ip_address: 1.1.0.1
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65500'
    peer: BB1
    description: BB1_Loopback0
  - ip_address: 1.1.0.2
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65500'
    peer: BB2
    description: BB2_Loopback0
  - ip_address: 172.16.4.5
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65500'
    peer: BB1
    description: BB1
  - ip_address: 172.16.4.7
    peer_group: LOCAL-UNDERLAY-PEERS
    remote_as: '65500'
    peer: BB2
    description: BB2
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 50
    tenant: DUALSTACK
    rd: 1.1.4.8:10050
    rd_evpn_domain:
      domain: remote
      rd: 1.1.4.8:10050
    route_targets:
      both:
      - 10050:10050
      import_export_evpn_domains:
      - domain: remote
        route_target: 10050:10050
    redistribute_routes:
    - learned
  - id: 70
    tenant: DUALSTACK
    rd: 1.1.4.8:10070
