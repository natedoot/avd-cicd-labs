  - ip_address: 1.1.4.8
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65478'
    peer: D-LEAF8
    description: D-LEAF8_Loopback0
  neighbor_interfaces:
  - name: Ethernet1
    remote_as: '65412'
    peer: D-LEAF1
    peer_group: LOCAL-UNDERLAY-PEERS
    description: D-LEAF1_Ethernet4
  - name: Ethernet2
    remote_as: '65412'
    peer: D-LEAF2
    peer_group: LOCAL-UNDERLAY-PEERS
    description: D-LEAF2_Ethernet4
  - name: Ethernet3
    remote_as: '65434'
    peer: D-LEAF3
    peer_group: LOCAL-UNDERLAY-PEERS
    description: D-LEAF3_Ethernet4
  - name: Ethernet4
    remote_as: '65434'
    peer: D-LEAF4
    peer_group: LOCAL-UNDERLAY-PEERS
    description: D-LEAF4_Ethernet4
  - name: Ethernet5
