  - name: Ethernet8
    remote_as: '65478'
    peer: D-LEAF8
    peer_group: LOCAL-UNDERLAY-PEERS
    description: D-LEAF8_Ethernet4
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: LOCAL-UNDERLAY-PEERS
      activate: true
      next_hop:
        address_family_ipv6:
