- name: PL-LOOPBACKS-EVPN-OVERLAY-V6
  sequence_numbers:
  - sequence: 10
    action: permit 2001:db8:d:1::/64 eq 128
ipv6_unicast_routing: true
is_deployed: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$JIWpYntS5KpTMCGF$el6rGKnDYPqxKeMcJGutPctkOMiHrV/bej1DTmdTR8jEnuV/gQbTYa76slNHP1vwyN8Gq2kbNsMmXUwVhkwjy1
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 1.1.4.204/32
  ipv6_address: 2001:db8:d:1::cc/128
mac_address_table:
  aging_time: 1800
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.24/24
  type: oob
metadata:
  platform: vEOS-lab
  pod_name: pod-d
  dc_name: domain-d
  fabric_name: FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: domain-d
    - name: topology_hint_fabric
      value: FABRIC
    - name: topology_hint_pod
      value: pod-d
  digital_twin:
    environment: act
    node_type: veos
    ip_addr: 192.168.0.24/24
    version: 4.33.1.1F
    username: admin
    password: admin
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 1.1.4.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
  - sequence: 30
    type: permit
    match:
    - ipv6 address prefix-list PL-LOOPBACKS-EVPN-OVERLAY-V6
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65400'
  router_id: 1.1.4.204
  distance:
    external_routes: 20
    internal_routes: 200
    local_routes: 200
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
    ecmp: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: LOCAL-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2001:db8:d:1::1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65412'
    peer: D-LEAF1
    description: D-LEAF1_Loopback0
  - ip_address: 2001:db8:d:1::2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65412'
    peer: D-LEAF2
    description: D-LEAF2_Loopback0
  - ip_address: 2001:db8:d:1::3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65434'
    peer: D-LEAF3
    description: D-LEAF3_Loopback0
  - ip_address: 2001:db8:d:1::4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65434'
    peer: D-LEAF4
    description: D-LEAF4_Loopback0
  - ip_address: 2001:db8:d:1::5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65456'
    peer: D-LEAF5
    description: D-LEAF5_Loopback0
  - ip_address: 2001:db8:d:1::6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65456'
    peer: D-LEAF6
    description: D-LEAF6_Loopback0
  - ip_address: 1.1.4.7
